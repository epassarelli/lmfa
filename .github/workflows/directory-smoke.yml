name: Directory Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL base de staging, sin slash final
        required: true
        type: string
      directory_mode:
        description: Directorios apagados (dark) o habilitados (light)
        required: true
        default: dark
        type: choice
        options:
          - dark
          - light
      penia_slug:
        description: Slug público de Peña para el smoke light
        required: false
        type: string
      radio_slug:
        description: Slug público de Radio para el smoke light
        required: false
        type: string
      program_slug:
        description: Slug público de ProgramaRadio para el smoke light
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run public directory smoke
        env:
          BASE_URL: ${{ inputs.base_url }}
          DIRECTORY_MODE: ${{ inputs.directory_mode }}
          PENIA_SLUG: ${{ inputs.penia_slug }}
          RADIO_SLUG: ${{ inputs.radio_slug }}
          PROGRAM_SLUG: ${{ inputs.program_slug }}
        run: bash scripts/smoke-directories.sh
