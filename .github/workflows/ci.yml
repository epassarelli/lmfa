name: CI

# Validates Laravel changes on feature branches and pull requests.

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mfa
          MYSQL_USER: mfa
          MYSQL_PASSWORD: mfa
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mfa
      DB_USERNAME: mfa
      DB_PASSWORD: mfa
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.testing .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -umfa -pmfa --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Determine changed PHP files
        id: changed-php
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.php' > /tmp/changed-php.txt
          else
            git diff --name-only --diff-filter=ACMRT HEAD^ HEAD -- '*.php' > /tmp/changed-php.txt || true
          fi
          cat /tmp/changed-php.txt

      - name: PHP syntax check
        shell: bash
        run: |
          if [ -s /tmp/changed-php.txt ]; then
            while IFS= read -r file; do php -l "$file"; done < /tmp/changed-php.txt
          else
            echo "No changed PHP files."
          fi

      - name: Pint
        shell: bash
        run: |
          if [ -s /tmp/changed-php.txt ]; then
            xargs vendor/bin/pint --test < /tmp/changed-php.txt
          else
            echo "No changed PHP files."
          fi

      - name: PHPUnit
        run: php artisan test
